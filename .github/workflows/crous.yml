name: CROUS Nancy

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Envoyer seulement un message de test Telegram (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: crous-scraper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}

      - name: Save list of already-seen listings
        run: |
          if [ -n "$(git status --porcelain seen.json 2>/dev/null)" ]; then
            git config user.name "crous-bot"
            git config user.email "crous-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen listings"
            git pull --rebase origin main || true
            git push
          fi
